<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paperlink</title>
<style>
/* Direction: calm, exact, a little warm. A desk with paper worksheets and a
   graphite pencil. The page carries the moment; the chrome stays quiet, and the
   pen icon takes the current ink colour. Spacing on a 4px grid, one easing. */
:root {
  color-scheme: light;
  --desk: #eeebe5;
  --surface: #fbfaf7;
  --raised: #efebe4;
  --paper: #fffdf9;
  --ink: #1f1b16;
  --secondary: #5e554a;
  --muted: #7b7266;
  --line: rgb(31 27 22 / 0.1);
  --grid: rgb(31 27 22 / 0.09);
  --accent: #ff7028;
  --accent-ink: #b9480f;
  --accent-soft: rgb(255 112 40 / 0.14);
  --shadow: 0 1px 2px rgb(31 27 22 / 0.06), 0 8px 24px rgb(31 27 22 / 0.08);
  --page-shadow: rgb(31 27 22 / 0.07);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
:root[data-theme=dark] {
  color-scheme: dark;
  --desk: #121110;
  --surface: #1c1a18;
  --raised: #282623;
  --paper: #1a1917;
  --ink: #efe9de;
  --secondary: #aaa398;
  --muted: #8a847a;
  --line: rgb(239 233 222 / 0.09);
  --grid: rgb(239 233 222 / 0.07);
  --accent-ink: #ff8a4c;
  --accent-soft: rgb(255 112 40 / 0.18);
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.35);
  --page-shadow: rgb(0 0 0 / 0.35);
}
* { box-sizing: border-box; }
html { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
  margin: 0;
  background: var(--desk);
  color: var(--ink);
  font: 14px/20px var(--font);
  -webkit-font-smoothing: antialiased;
}
header {
  flex-shrink: 0;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px 0 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
strong { display: flex; align-items: center; font-size: 16px; font-weight: 600; letter-spacing: 0; }
strong::before {
  content: '';
  width: 8px;
  height: 8px;
  margin: 0 20px 0 0;
  background: #ff7028;
  box-shadow: 0 -8px #ffb02e, 8px 0 #ffb02e, 0 8px #f34d2c;
}
strong span { color: var(--ink); }
#document-title { min-width: 0; overflow: hidden; color: var(--secondary); white-space: nowrap; text-overflow: ellipsis; }
#document-title:not(:empty)::before { content: '/'; margin-right: 12px; color: var(--muted); }
.header-actions { margin-left: auto; display: flex; gap: 4px; }
header button { width: 36px; height: 36px; min-height: 36px; padding: 8px; border: 0; background: transparent; color: var(--secondary); }
header .icon { width: 20px; height: 20px; }
#storage-info { position: fixed; inset: 56px 12px auto auto; margin: 0; width: min(320px, calc(100vw - 24px)); padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
#storage-info p { margin: 4px 0 12px; line-height: 20px; color: var(--secondary); font-size: 13px; }
#storage-info button { width: 100%; margin-top: 8px; }
#status { font-weight: 500; }
nav {
  position: absolute;
  z-index: 2;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: var(--shadow);
  transition: opacity 120ms var(--ease), translate 120ms var(--ease);
  max-width: calc(100vw - 16px);
  overflow-x: auto;
  scrollbar-width: none;
}
nav.is-hidden { opacity: 0; translate: 0 -8px; pointer-events: none; }
nav button { flex-shrink: 0; width: 40px; height: 40px; min-height: 40px; padding: 9px; border: 0; color: var(--secondary); }
nav .separator { flex-shrink: 0; width: 1px; height: 24px; margin: 0 4px; background: var(--line); }
.icon { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
button {
  min-height: 36px;
  font: inherit;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  padding: 8px 16px;
  border-radius: 10px;
  cursor: pointer;
  transition: background-color 120ms var(--ease), color 120ms var(--ease), border-color 120ms var(--ease), transform 120ms var(--ease);
  -webkit-tap-highlight-color: transparent;
}
button:hover { background: var(--raised); }
button:active { transform: scale(0.97); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* The active tool: a surface step with a hairline, not a fill. */
nav button[aria-pressed=true] { background: var(--raised); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
/* Signature: the pen and highlighter icons carry the ink they draw with. */
#pen, #marker, #shape-tool, #text-tool { position: relative; }
#pen::after, #marker::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 5px; height: 3px; border-radius: 2px; background: var(--tool-ink, var(--ink)); opacity: 0; transition: opacity 120ms var(--ease); }
#pen[aria-pressed=true]::after, #marker[aria-pressed=true]::after { opacity: 1; }
nav button:disabled { opacity: 0.35; background: transparent; cursor: default; transform: none; }
.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 500; }
.primary:hover { background: var(--secondary); }
/* Options of the active tool: tap it again. */
.panel { position: absolute; z-index: 3; display: flex; flex-wrap: nowrap; overflow-x: auto; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); scrollbar-width: none; animation: rise 160ms var(--ease); }
.panel[hidden] { display: none; }
@keyframes rise { from { opacity: 0; translate: 0 -4px; } }
#tool-options { top: 116px; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 32px); }
.panel .group { display: flex; gap: 2px; align-items: center; }
.panel .group + .group { padding-left: 4px; margin-left: 4px; border-left: 1px solid var(--line); }
.panel button { flex-shrink: 0; min-height: 36px; padding: 6px 12px; border: 0; border-radius: 10px; background: transparent; font-size: 13px; color: var(--secondary); }
.panel button:hover { background: var(--raised); }
.panel button[aria-pressed=true] { background: var(--raised); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.panel .swatch { width: 36px; padding: 0; display: grid; place-items: center; }
.panel .swatch span { width: 20px; height: 20px; border-radius: 50%; background: var(--color, var(--ink)); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.12); }
.panel .swatch[aria-pressed=true] { background: transparent; box-shadow: none; }
.panel .swatch[aria-pressed=true] span { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.panel .size span { display: block; width: 20px; height: var(--size); border-radius: 4px; background: var(--ink); }
#pick-actions { transform: translateX(-50%); }
#text-editor { position: absolute; z-index: 1; margin: 0; padding: 0; border: 1px dashed var(--accent); border-radius: 2px; outline: none; background: transparent; color: var(--ink); font-family: Arial, Helvetica, sans-serif; line-height: 1.25; white-space: pre; overflow: hidden; resize: none; user-select: text; -webkit-user-select: text; }
#text-editor.on-pdf { color: #1f1b16; }
#overview { position: fixed; z-index: 4; inset: 0; display: grid; place-items: center; background: rgb(18 17 16 / 0.32); animation: fade 160ms var(--ease); }
@keyframes fade { from { opacity: 0; } }
#overview[hidden] { display: none; }
#overview > div { width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow: auto; padding: 20px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); }
#overview .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 16px; font-weight: 500; }
#overview .head button { width: 36px; padding: 0; border: 0; color: var(--secondary); }
#overview .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 16px; }
#overview figure { position: relative; margin: 0; text-align: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
#overview figcaption { margin-top: 8px; }
#overview figure > button { display: block; width: 100%; padding: 0; border: 0; border-radius: 6px; background: transparent; box-shadow: 0 0 0 1px var(--line), 0 2px 8px var(--page-shadow); overflow: hidden; }
#overview figure > button[aria-current=true] { box-shadow: 0 0 0 2px var(--accent), 0 2px 8px var(--page-shadow); }
#overview .thumb { display: block; width: 100%; height: auto; }
#overview .remove { position: absolute; top: 8px; right: 8px; width: 28px; min-height: 28px; padding: 0; border-radius: 8px; background: var(--surface); color: var(--secondary); }
main {
  position: relative;
  width: 100%;
  flex: 1;
  min-height: 0;
  margin: 0;
  padding: 0;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
#sheet {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}
:is(#sheet, .thumb) .page { fill: var(--paper); stroke: var(--line); }
#sheet .page-shadow { fill: var(--page-shadow); }
#sheet .grid-line { fill: none; stroke: var(--grid); }
:is(#sheet, .thumb) .ink path { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
/* PDF pages keep their original look in both themes, so ink stays dark on them. */
:is(#sheet, .thumb) .pdf-page .page { fill: #ffffff; }
:is(#sheet, .thumb) .pdf-page .ink path { stroke: #1f1b16; }
/* Pressure strokes are filled outlines; text uses the theme ink unless coloured. */
:is(#sheet, .thumb) .marks path, #live path { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
:is(#sheet, .thumb) path.filled, #live path.filled { fill: var(--ink); stroke: none; }
:is(#sheet, .thumb) .pdf-page path.filled { fill: #1f1b16; stroke: none; }
:is(#sheet, .thumb) .ink text { fill: var(--ink); font-family: Arial, Helvetica, sans-serif; white-space: pre; }
:is(#sheet, .thumb) .pdf-page .ink text { fill: #1f1b16; }
:is(#sheet, .thumb, #live) .highlight { opacity: 0.35; }
#sheet .lasso { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 5 4; }
#sheet .pick-box { fill: none; stroke: var(--accent); stroke-dasharray: 6 4; }
#sheet .is-editing { visibility: hidden; }
@media (max-width: 600px) {
  header { padding: 0 8px 0 16px; }
  #document-title { display: none; }
}
/* Assistant notes: a separate layer over the page, readable at every zoom. */
#notes { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
#notes.is-hidden { display: none; }
.note { position: absolute; pointer-events: auto; width: max-content; max-width: 280px; padding: 8px 32px 8px 12px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-size: 13px; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
.note.stale { border-left-color: var(--muted); }
.note small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 16px; }
.note button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; min-height: 24px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; }
#notes-toggle span { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
#page-nav { display: flex; align-items: center; gap: 2px; }
#page-nav[hidden] { display: none; }
#page-number { min-width: 48px; padding: 0 4px; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--secondary); }
#sheet .selection { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 6 4; }
#ask { position: fixed; z-index: 3; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(420px, calc(100vw - 32px)); margin: 0; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); animation: rise 220ms var(--ease); }
#ask textarea { width: 100%; min-height: 72px; margin: 8px 0 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font: inherit; resize: vertical; }
#ask textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
#ask .actions { display: flex; gap: 8px; justify-content: flex-end; }
#ask label { color: var(--secondary); font-size: 13px; }
#ask-send { background: var(--accent); color: #1f1208; border-color: var(--accent); font-weight: 500; }
#ask-send:hover { background: #ff8a4c; }
#info[data-error=true] { color: #dc2626; background: rgb(220 38 38 / 0.1); }
#connection-status[data-error=true] { color: #dc2626; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<header>
<strong>paper<span>link</span></strong>
<span id="document-title"></span>

<div class="header-actions">
<button id="info" aria-label="Storage information" title="Storage information" popovertarget="storage-info"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.5"/></svg></button>
<button id="theme" aria-label="Color scheme: System" title="Color scheme: System"></button>
</div>
</header>
<div id="storage-info" popover>
<span id="status" role="status">Local draft</span>
<p id="connection-status" role="status">Open a canvas with a link or QR code from the CLI. Edits save automatically; drawings made before that can be imported with the CLI while this tab stays open.</p>
<button id="retry-save" hidden>Retry pending save</button>
<button id="export-pdf" hidden>Export PDF</button>
</div>
<nav aria-label="Drawing tools">
<button id="pen" aria-label="Pen" title="Pen (tap again for colour and width)" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4 5 5M4 20l4-1 12-12a2.1 2.1 0 0 0-3-3L5 16l-1 4Z"/></svg></button>
<button id="marker" aria-label="Highlighter" title="Highlighter (tap again for colours)" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 4 6 6-8 8H8v-4Z"/><path d="m8 18-3 2M4 21h9"/></svg></button>
<button id="ask-tool" aria-label="Ask the assistant about a region" title="Ask the assistant about a region" aria-pressed="false" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4Z"/><path d="M10 9.5a2 2 0 1 1 2.5 1.9c-.4.2-.5.5-.5.9M12 14v.3"/></svg></button>
<button id="eraser" aria-label="Eraser" title="Eraser (tap again: whole strokes or precise)" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m13 4 7 7a2 2 0 0 1 0 3l-6 6H8l-5-5a2 2 0 0 1 0-3l7-8a2 2 0 0 1 3 0ZM7 9l9 9M8 20h13"/></svg></button>
<button id="lasso" aria-label="Lasso: select, move, recolour" title="Lasso: select, move, recolour" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4c5 0 8 2.5 8 5.5S16.5 15 12 15 4 12.5 4 9.5 7 4 12 4Z" stroke-dasharray="2.5 2.5"/><path d="M8 14c-1.5 2-.5 4.5 2 5.5"/></svg></button>
<button id="shape-tool" aria-label="Shapes" title="Shapes (tap again to choose)" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="9" height="9"/><circle cx="16" cy="8" r="5"/></svg></button>
<button id="text-tool" aria-label="Text" title="Text" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7V4h14v3M12 4v16M9 20h6"/></svg></button>
<span class="separator" aria-hidden="true"></span>
<button id="undo" aria-label="Undo" title="Undo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 4 10l5 5M4 10h10a6 6 0 0 1 0 12" transform="translate(0 -2)"/></svg></button>
<button id="redo" aria-label="Redo" title="Redo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 5 5-5 5m5-5H10a6 6 0 0 0 0 12" transform="translate(0 -2)"/></svg></button>
<span class="separator" aria-hidden="true"></span>
<button id="fit" aria-label="Fit page" title="Fit page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<button id="notes-toggle" aria-label="Hide assistant notes" title="Hide assistant notes" aria-pressed="true" hidden><span>0</span></button>
<button id="add-page" aria-label="Add page" title="Add page" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6ZM12 10v8M8 14h8"/></svg></button>
<button id="pages-button" aria-label="All pages" title="All pages" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg></button>
<div id="page-nav" hidden>
<span class="separator" aria-hidden="true"></span>
<button id="previous-page" aria-label="Previous page" title="Previous page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
<span id="page-number" role="status" aria-label="Page">1 / 1</span>
<button id="next-page" aria-label="Next page" title="Next page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
</div>
</nav>
<div id="tool-options" class="panel" hidden></div>
<div id="overview" hidden><div role="dialog" aria-label="All pages"><div class="head"><span>Pages</span><button id="overview-close" aria-label="Close">×</button></div><div class="grid"></div></div></div>
<form id="ask" hidden>
<label for="ask-question">Ask about the marked area (optional)</label>
<textarea id="ask-question" maxlength="1000" placeholder="e.g. Is this step right?"></textarea>
<div class="actions"><button type="button" id="ask-cancel">Cancel</button><button type="submit" id="ask-send">Ask</button></div>
</form>
<main><div id="notes" aria-label="Assistant notes"></div><textarea id="text-editor" hidden spellcheck="false" aria-label="Text"></textarea><div id="pick-actions" class="panel" hidden></div><svg id="sheet" aria-label="Writing surface">
<defs>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path class="grid-line" d="M 28 0 L 0 0 0 28"/></pattern>
</defs>
<rect id="mat-area" fill="none"/>
<g id="pages"></g>
<g id="live"></g>
<g id="overlay"></g>
</svg></main>
<script type="module">
import { eraseFrom, formatStroke, inLasso, parseStroke, shapePoints, strokeBounds, strokeDistance, strokePath, textLines, touches, translateStroke, restyleStroke } from '/ink.js';
const SVG = 'http://www.w3.org/2000/svg';
const sheet = document.querySelector('#sheet');
const pageLayer = document.querySelector('#pages');
const toolbar = document.querySelector('nav');
let toolbarTimer;
function hideToolbar() {
  clearTimeout(toolbarTimer);
  toolbar.classList.add('is-hidden');
  toolbar.inert = true;
}
function revealToolbarSoon() {
  clearTimeout(toolbarTimer);
  toolbarTimer = setTimeout(() => {
    toolbar.classList.remove('is-hidden');
    toolbar.inert = false;
  }, 100);
}
const status = document.querySelector('#status');
const theme = document.querySelector('#theme');
const media = matchMedia('(prefers-color-scheme: dark)');
function element(name, attributes = {}) {
  const node = document.createElementNS(SVG, name);
  for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
  return node;
}
// randomUUID needs a secure context, which plain-HTTP LAN pages are not.
function newId() {
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  bytes[6] = (bytes[6] & 0x0f) | 0x40; bytes[8] = (bytes[8] & 0x3f) | 0x80;
  const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
  return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
}

// ── Document: pages stacked vertically; strokes use page coordinates ──
const PAGE_GAP = 40;
const blankPage = () => ({ id: newId(), width: 900, height: 1273, strokes: [] }); // A4
let pages = [blankPage()], past = [], future = [], active = null, tool = 'pen';
let gestureOps = [], previousPoint = null, gestureTool = null, drawing = null, selection = null;
try {
  const draft = JSON.parse(localStorage.getItem('paperlink-draft') || '[]');
  if (Array.isArray(draft)) pages[0].strokes = draft;
} catch {}
function pageTop(index) {
  let y = 0;
  for (let i = 0; i < index; i++) y += pages[i].height + PAGE_GAP;
  return y;
}
const documentWidth = () => Math.max(...pages.map(page => page.width));
const documentHeight = () => pageTop(pages.length) - PAGE_GAP;
// The page under a point, or the nearest one: writing may run over page edges.
function pageAt(y) {
  for (let i = 0, top = 0; i < pages.length; i++) {
    if (y < top + pages[i].height + PAGE_GAP / 2 || i === pages.length - 1) return i;
    top += pages[i].height + PAGE_GAP;
  }
  return 0;
}
// Edits are operations, the same ones the server merges from every device:
// add/remove a stroke, add/remove a page. Each is idempotent, so replays and
// edits from other devices converge; undo inverts only this device's edits.
let annotations = [];
function applyOps(target, ops, notes = annotations) {
  for (const op of ops) {
    if (op.type === 'addAnnotation') { if (!notes.some(note => note.id === op.annotation.id)) notes.push(op.annotation); continue; }

    } catch { if (controller.signal.aborted) return; }
    live = false;
    if (!queue.length) showSaveState();
    // Back off, but reconnect at once when a save shows the server is back.
    await new Promise(resolve => { wakeStream = resolve; setTimeout(resolve, delay); });
    wakeStream = null;
    delay = Math.min(delay * 2, 15000);
  }
}
// After a whole-document change elsewhere: take the server's state and keep
// this device's unsent edits on top.
async function reloadDocument() {
  if (!currentDocument) return;
  const document = await api('/' + currentDocument.id);
  if (active !== null) { setTimeout(() => void reloadDocument(), 300); return; }
  annotations = document.annotations ? document.annotations.slice() : [];
  pages = applyOps(document.pages, queue.flatMap(batch => batch.ops));
  incoming = [];
  currentDocument.revision = document.revision;
  render();
}

function adopt(document, contents) {
  currentDocument = { id: document.id, title: document.title, revision: document.revision, assistant: Boolean(document.assistant) };
  loadPdf(document).catch(error => report('The PDF could not be loaded: ' + error.message, true));
  try { sessionStorage.setItem('paperlink-open-canvas', document.id); } catch {}
  if (location.hash !== '#canvas=' + document.id) history.replaceState(null, '', location.pathname + '#canvas=' + document.id);
  pages = contents;
  annotations = document.annotations ? document.annotations.slice() : [];
  past = []; future = []; incoming = []; saveBlocked = false; live = false;
  try { queue = JSON.parse(localStorage.getItem(queueKey(document.id)) || '[]'); } catch { queue = []; }
  for (const batch of queue) ownBatches.add(batch.operationId);
  applyOps(pages, queue.flatMap(batch => batch.ops));
  render();
  fit();
  status.textContent = 'Opened · ' + document.title;
}
// `extraStrokes`: strokes drawn on page 1 before a draft import, not yet on the server.
async function openCanvas(id, { extraStrokes = [] } = {}) {
  const document = await api('/' + id);
  adopt(document, document.pages);
  const ops = extraStrokes.filter(stroke => !document.pages[0].strokes.includes(stroke)).map(stroke => ({ type: 'add', page: document.pages[0].id, stroke }));
  // Unsaved edits stored by earlier versions hold whole pages.
  const legacy = localStorage.getItem('paperlink-pending-' + id);
  if (legacy) {
    try {
      const saved = JSON.parse(legacy);
      ops.push(...diffOps(document.pages, saved.pages || [{ ...document.pages[0], strokes: saved.strokes }]));
      report('Recovered local edits. Saving them now.');
    } catch {}
    localStorage.removeItem('paperlink-pending-' + id);
  }
  if (ops.length) { applyOps(pages, ops); render(); saveToVault(ops); }
  else if (queue.length) void flushQueue();
  else showSaveState();
  void listen(id);
}
function action(id, callback) {
  document.getElementById(id).onclick = async () => {
    try { await callback(); }
    catch (error) { report(error.message, true); }
  };
}
action('retry-save', async () => { clearTimeout(retryTimer); await flushQueue(); });
// Downloads the canvas as a PDF (on the iPad: save to Files or share it).
action('export-pdf', async () => {
  if (!currentDocument) return;
  const button = document.querySelector('#export-pdf');
  button.disabled = true;
  button.textContent = 'Exporting…';
  try {
    if (queue.length) await flushQueue();
    const response = await fetch('/api/canvases/' + currentDocument.id + '/export.pdf', { headers: { Authorization: 'Bearer ' + deviceToken } });
    if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || 'Export failed.');
    const url = URL.createObjectURL(await response.blob());
    const link = Object.assign(document.createElement('a'), { href: url, download: currentDocument.title.replace(/[\\/:*?"<>|]/g, ' ') + '.pdf' });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } finally {
    button.disabled = false;
    button.textContent = 'Export PDF';
  }
});
let previouslyOpen = canvasFromLink;
try { previouslyOpen ||= sessionStorage.getItem('paperlink-open-canvas'); } catch {}
let loading = Boolean(previouslyOpen);
if (previouslyOpen) {
  sheet.style.pointerEvents = 'none';
  paired.then(() => openCanvas(previouslyOpen)).catch(error => {
    report(error.message, true);
    document.querySelector('#storage-info').showPopover();
  }).finally(() => { loading = false; sheet.style.pointerEvents = ''; });
}
// A connected draft can be imported by the local CLI without a file-management UI.
let browserDraftId;
try {
  browserDraftId = sessionStorage.getItem('paperlink-browser-draft') || operationId();
  sessionStorage.setItem('paperlink-browser-draft', browserDraftId);
} catch { browserDraftId = operationId(); }
let polling = false;
async function publishDraft() {
  if (!deviceToken || loading || polling || active !== null || currentDocument) return;
  polling = true;
  try {
    const result = await api('/drafts/' + browserDraftId, { method: 'PUT', body: JSON.stringify({ strokes: pages[0].strokes.slice() }) });
    if (result.document && active === null) {
      await openCanvas(result.document.id, { extraStrokes: pages[0].strokes.slice() });
      browserDraftId = operationId();
      try { sessionStorage.setItem('paperlink-browser-draft', browserDraftId); } catch {}
    }
  } catch { /* The local draft remains available while disconnected. */ }
  finally { polling = false; }
}
setInterval(publishDraft, 2000);
void publishDraft();
window.addEventListener('online', () => { if (currentDocument) { clearTimeout(retryTimer); void flushQueue(); wakeStream?.(); } });

</script>
