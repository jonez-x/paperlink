<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paperlink</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f3ea;
  --paper: #fffdf5;
  --ink: #24231f;
  --muted: #777367;
  --line: #dedbd0;
  --grid: #eae7dd;
  --accent: #ff7028;
}
:root[data-theme=dark] {
  color-scheme: dark;
  --bg: #111111;
  --paper: #171716;
  --ink: #f4f3eb;
  --muted: #a09e94;
  --line: #30302c;
  --grid: #252522;
  --accent: #ff7028;
}
* { box-sizing: border-box; }
html { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
  margin: 0;
  background-color: var(--bg);
  background-image: linear-gradient(var(--line) 1px, transparent 1px),
                    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 240px 240px;
  color: var(--ink);
  font: 14px Arial, Helvetica, sans-serif;
}
header {
  flex-shrink: 0;
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 24px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
strong { display: flex; align-items: center; font-size: 20px; letter-spacing: -1px; font-weight: 600; }
strong::before {
  content: '';
  width: 10px;
  height: 10px;
  margin-right: 20px;
  background: #ff7028;
  box-shadow: 0 -10px #ffb02e, 10px 0 #ffb02e, 0 10px #f34d2c;
}
strong span { color: var(--ink); }
 .header-actions { margin-left: auto; display: flex; gap: 4px; }
header button { padding: 10px; width: 44px; height: 44px; border: 0; background: transparent; }
#storage-info { position: fixed; inset: 54px 24px auto auto; margin: 0; max-width: min(300px, calc(100vw - 32px)); padding: 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); box-shadow: 0 4px 20px #0002; }
#storage-info p { margin: 8px 0 0; line-height: 1.5; color: var(--muted); font-size: 13px; }
#status { font-size: 14px; }
nav {
  position: absolute;
  z-index: 2;
  top: 76px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  box-shadow: 0 4px 18px #00000018;
  transition: opacity 80ms ease, translate 80ms ease;
}
nav.is-hidden { opacity: 0; translate: 0 -8px; pointer-events: none; }
nav button { width: 44px; height: 44px; min-height: 44px; padding: 10px; border: 0; border-radius: 4px; }
nav .separator { width: 1px; margin: 8px 3px; background: var(--line); }
.icon { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { nav { transition: none; } }
button {
  min-height: 44px;
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 10px 18px;
  border-radius: 0;
}
nav button + button { border-left: 0; }
button[aria-pressed=true] { background: var(--accent); color: #17120b; }
button { cursor: pointer; }
button:hover { background: var(--line); }
button[aria-pressed=true]:hover { background: #ff8b40; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
main {
  position: relative;
  width: 100%;
  max-width: none;
  flex: 1;
  min-height: 0;
  margin: 0 auto;
  padding: 12px 24px 24px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
main::before, main::after {
  content: '';
  position: absolute;
  pointer-events: none;
  opacity: .65;
}
main::before {
  top: 12px;
  bottom: 24px;
  left: 12px;
  width: 6px;
  background: repeating-linear-gradient(to bottom, var(--muted) 0 1px, transparent 1px 14px);
}
main::after {
  bottom: 12px;
  left: 24px;
  right: 24px;
  height: 6px;
  background: repeating-linear-gradient(to right, var(--muted) 0 1px, transparent 1px 14px);
}
#sheet {
  display: block;
  width: 100%;
  height: 100%;
  border: 1px solid var(--line);
  touch-action: none;
}
#sheet .page { fill: var(--paper); stroke: var(--line); }
#sheet .grid-line { fill: none; stroke: var(--grid); }
#sheet .mat-line { fill: none; stroke: var(--line); }
#sheet .ink path { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
/* PDF pages keep their original look in both themes, so ink stays dark on them. */
#sheet .pdf-page .page { fill: #ffffff; }
#sheet .pdf-page .ink path { stroke: #24231f; }
@media (max-width: 600px) {
  header { padding: 0 16px; gap: 12px; }

  main { padding: 12px 20px 20px; }
  main::before { left: 8px; bottom: 20px; }
  main::after { bottom: 8px; left: 20px; right: 20px; }
  nav { top: 72px; }
}
/* Assistant notes: a separate layer over the page, readable at every zoom. */
#notes { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
#notes.is-hidden { display: none; }
.note { position: absolute; pointer-events: auto; width: max-content; max-width: 280px; padding: 8px 30px 8px 10px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 4px; background: var(--bg); color: var(--ink); box-shadow: 0 4px 14px #0000002a; font-size: 13px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.note.stale { border-left-color: var(--muted); }
.note small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
.note button { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; min-height: 24px; padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; }
#notes-toggle span { font-size: 11px; font-weight: 600; }
#info[data-error=true] { color: #df5429; background: #df542918; }
#connection-status[data-error=true] { color: #df5429; }
</style>
<header>
<strong>paper<span>link</span></strong>

<div class="header-actions">
<button id="info" aria-label="Storage information" title="Storage information" popovertarget="storage-info"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.5"/></svg></button>
<button id="theme" aria-label="Color scheme: System" title="Color scheme: System"></button>
</div>
</header>
<div id="storage-info" popover>
<span id="status" role="status">Local draft</span>
<p id="connection-status" role="status">Open a canvas with a link or QR code from the CLI. Edits save automatically; drawings made before that can be imported with the CLI while this tab stays open.</p>
<button id="retry-save" hidden>Retry pending save</button>
<button id="export-pdf" hidden>Export PDF</button>
</div>
<nav aria-label="Drawing tools">
<button id="pen" aria-label="Pen" title="Pen" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4 5 5M4 20l4-1 12-12a2.1 2.1 0 0 0-3-3L5 16l-1 4Z"/></svg></button>
<button id="eraser" aria-label="Eraser" title="Eraser" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m13 4 7 7a2 2 0 0 1 0 3l-6 6H8l-5-5a2 2 0 0 1 0-3l7-8a2 2 0 0 1 3 0ZM7 9l9 9M8 20h13"/></svg></button>
<span class="separator" aria-hidden="true"></span>
<button id="undo" aria-label="Undo" title="Undo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 4 10l5 5M4 10h10a6 6 0 0 1 0 12" transform="translate(0 -2)"/></svg></button>
<button id="redo" aria-label="Redo" title="Redo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 5 5-5 5m5-5H10a6 6 0 0 0 0 12" transform="translate(0 -2)"/></svg></button>
<span class="separator" aria-hidden="true"></span>
<button id="fit" aria-label="Fit page" title="Fit page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<button id="notes-toggle" aria-label="Hide assistant notes" title="Hide assistant notes" aria-pressed="true" hidden><span>0</span></button>
<button id="add-page" aria-label="Add page" title="Add page" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6ZM12 10v8M8 14h8"/></svg></button>
</nav>
<main><div id="notes" aria-label="Assistant notes"></div><svg id="sheet" aria-label="Writing surface">
<defs>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path class="grid-line" d="M 28 0 L 0 0 0 28"/></pattern>
<pattern id="mat" width="240" height="240" patternUnits="userSpaceOnUse"><path class="mat-line" d="M 240 0 L 0 0 0 240"/></pattern>
</defs>
<rect id="mat-area" fill="url(#mat)"/>
<g id="pages"></g>
</svg></main>
<script>
const SVG = 'http://www.w3.org/2000/svg';
const sheet = document.querySelector('#sheet');
const pageLayer = document.querySelector('#pages');
const toolbar = document.querySelector('nav');
let toolbarTimer;
function hideToolbar() {
  clearTimeout(toolbarTimer);
  toolbar.classList.add('is-hidden');
  toolbar.inert = true;
}
function revealToolbarSoon() {
  clearTimeout(toolbarTimer);
  toolbarTimer = setTimeout(() => {
    toolbar.classList.remove('is-hidden');
    toolbar.inert = false;
  }, 100);
}
const status = document.querySelector('#status');
const theme = document.querySelector('#theme');
const media = matchMedia('(prefers-color-scheme: dark)');
function element(name, attributes = {}) {
  const node = document.createElementNS(SVG, name);
  for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
  return node;
}
// randomUUID needs a secure context, which plain-HTTP LAN pages are not.
function newId() {
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  bytes[6] = (bytes[6] & 0x0f) | 0x40; bytes[8] = (bytes[8] & 0x3f) | 0x80;
  const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
  return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
}

// ── Document: pages stacked vertically; strokes use page coordinates ──
const PAGE_GAP = 40;
const blankPage = () => ({ id: newId(), width: 900, height: 1273, strokes: [] }); // A4
let pages = [blankPage()], past = [], future = [], active = null, tool = 'pen';
let gestureOps = [], previousPoint = null, gestureTool = null, drawing = null;
try {
  const draft = JSON.parse(localStorage.getItem('paperlink-draft') || '[]');
  if (Array.isArray(draft)) pages[0].strokes = draft;
} catch {}
function pageTop(index) {
  let y = 0;
  for (let i = 0; i < index; i++) y += pages[i].height + PAGE_GAP;
  return y;
}
const documentWidth = () => Math.max(...pages.map(page => page.width));
const documentHeight = () => pageTop(pages.length) - PAGE_GAP;
// The page under a point, or the nearest one: writing may run over page edges.
function pageAt(y) {
  for (let i = 0, top = 0; i < pages.length; i++) {
    if (y < top + pages[i].height + PAGE_GAP / 2 || i === pages.length - 1) return i;
    top += pages[i].height + PAGE_GAP;
  }
  return 0;
}
// Edits are operations, the same ones the server merges from every device:
// add/remove a stroke, add/remove a page. Each is idempotent, so replays and
// edits from other devices converge; undo inverts only this device's edits.
let annotations = [];
function applyOps(target, ops, notes = annotations) {
  for (const op of ops) {
    if (op.type === 'addAnnotation') { if (!notes.some(note => note.id === op.annotation.id)) notes.push(op.annotation); continue; }
    if (op.type === 'removeAnnotation') { const at = notes.findIndex(note => note.id === op.id); if (at >= 0) notes.splice(at, 1); continue; }
    if (op.type === 'addPage') { if (!target.some(page => page.id === op.page.id)) target.push({ id: op.page.id, width: op.page.width, height: op.page.height, strokes: [] }); continue; }
    const index = target.findIndex(page => page.id === op.page);
    if (index < 0) continue;
    const page = target[index];
    if (op.type === 'add' && !page.strokes.includes(op.stroke)) page.strokes.push(op.stroke);
    if (op.type === 'remove') { const at = page.strokes.indexOf(op.stroke); if (at >= 0) page.strokes.splice(at, 1); }
    if (op.type === 'removePage' && page.pdfPage === undefined && target.length > 1) target.splice(index, 1);
  }
  return target;
}
const invert = ops => ops.slice().reverse().map(op =>
  op.type === 'add' ? { ...op, type: 'remove' } : op.type === 'remove' ? { ...op, type: 'add' }
  : op.type === 'addAnnotation' ? { type: 'removeAnnotation', id: op.annotation.id, annotation: op.annotation }
  : op.type === 'removeAnnotation' ? { type: 'addAnnotation', annotation: op.annotation }
  : op.type === 'addPage' ? { type: 'removePage', page: op.page.id, size: { width: op.page.width, height: op.page.height } }
  : { type: 'addPage', page: { id: op.page, ...op.size } });
// Differences between two page lists as operations (for edits stored by older versions).
function diffOps(from, to) {
  const ops = [];
  for (const page of to) {
    const before = from.find(candidate => candidate.id === page.id);
    if (!before) ops.push({ type: 'addPage', page: { id: page.id, width: page.width, height: page.height } });
    for (const stroke of page.strokes) if (!before?.strokes.includes(stroke)) ops.push({ type: 'add', page: page.id, stroke });
    for (const stroke of before?.strokes || []) if (!page.strokes.includes(stroke)) ops.push({ type: 'remove', page: page.id, stroke });
  }
  return ops;
}
function save(ops) {
  if (currentDocument) { saveToVault(ops); return; }
  try { localStorage.setItem('paperlink-draft', JSON.stringify(pages[0].strokes)); status.textContent = 'Saved in this browser'; }
  catch { status.textContent = 'Save failed – keep this browser open'; }
}
function render() {
  const groups = pages.map((page, index) => {
    const pdf = page.pdfPage !== undefined;
    const group = element('g', { transform: 'translate(0 ' + pageTop(index) + ')', class: pdf ? 'pdf-page' : '' });
    group.append(element('rect', { class: 'page', width: page.width, height: page.height, 'vector-effect': 'non-scaling-stroke' }));
    if (pdf) group.append(element('image', { 'data-page': page.id, width: page.width, height: page.height, preserveAspectRatio: 'none', ...(backgrounds.get(page.id) && { href: backgrounds.get(page.id).url }) }));
    else group.append(element('rect', { width: page.width, height: page.height, fill: 'url(#grid)' }));
    const ink = element('g', { class: 'ink' });
    for (const stroke of page.strokes) ink.append(element('path', { d: stroke }));
    group.append(ink);
    return group;
  });
  pageLayer.replaceChildren(...groups);
  renderNotes();
  document.querySelector('#add-page').hidden = !currentDocument;
  document.querySelector('#export-pdf').hidden = !currentDocument;
}
const inkOf = index => pageLayer.children[index]?.querySelector('.ink');

// ── View: pan and zoom in world units, independent of the stored strokes ──
let view = null; // { x, y, scale }: scale = screen pixels per world unit
function size() { return { width: sheet.clientWidth || 1, height: sheet.clientHeight || 1 }; }
function fitScale() {
  const { width, height } = size();
  return Math.min((width - 48) / documentWidth(), (height - 48) / pages[0].height);
}
function fit() {
  const { width } = size();
  const scale = fitScale();
  view = { scale, x: (documentWidth() - width / scale) / 2, y: -24 / scale };
  applyView();
}
function applyView() {
  const { width, height } = size();
  const minimum = fitScale() * 0.5, maximum = fitScale() * 8;
  view.scale = Math.min(maximum, Math.max(minimum, view.scale));
  // Keep part of the document in view.
  const w = width / view.scale, h = height / view.scale;
  view.x = Math.min(documentWidth() - w * 0.2, Math.max(-w * 0.8, view.x));
  view.y = Math.min(documentHeight() - h * 0.2, Math.max(-h * 0.8, view.y));
  sheet.setAttribute('viewBox', [view.x, view.y, w, h].join(' '));
  const mat = document.querySelector('#mat-area');
  for (const [key, value] of Object.entries({ x: view.x, y: view.y, width: w, height: h })) mat.setAttribute(key, value);
  // Grid lines stay one screen pixel wide at every zoom level.
  for (const line of sheet.querySelectorAll('.grid-line, .mat-line')) line.setAttribute('stroke-width', 1 / view.scale);
  scheduleBackgrounds();
  positionNotes();
}

// ── Assistant notes ──
const notesLayer = document.querySelector('#notes');
const notesToggle = document.querySelector('#notes-toggle');
function renderNotes() {
  notesLayer.replaceChildren(...annotations.map(note => {
    const card = document.createElement('div');
    card.className = 'note' + (note.stale ? ' stale' : '');
    card.dataset.id = note.id;
    card.textContent = note.text;
    const meta = document.createElement('small');
    meta.textContent = (note.author || 'Note') + (note.stale ? ' · written for an earlier version' : '');
    const remove = Object.assign(document.createElement('button'), { textContent: '×', title: 'Remove note' });
    remove.setAttribute('aria-label', 'Remove note');
    remove.onclick = () => {
      const ops = [{ type: 'removeAnnotation', id: note.id, annotation: note }];
      applyOps(pages, ops);
      past.push(ops);
      future = [];
      renderNotes();
      save(ops);
    };
    card.append(meta, remove);
    return card;
  }));
  notesToggle.hidden = !annotations.length;
  notesToggle.querySelector('span').textContent = annotations.length;
  positionNotes();
}
// Notes sit at their page position and keep a fixed screen size.
function positionNotes() {
  if (!view || !annotations.length) return;
  const sheetBox = sheet.getBoundingClientRect(), layerBox = notesLayer.getBoundingClientRect();
  for (const card of notesLayer.children) {
    const note = annotations.find(entry => entry.id === card.dataset.id);
    const index = pages.findIndex(page => page.id === note?.page);
    if (index < 0) { card.hidden = true; continue; }
    card.hidden = false;
    card.style.left = (sheetBox.left - layerBox.left + (note.x - view.x) * view.scale) + 'px';
    card.style.top = (sheetBox.top - layerBox.top + (pageTop(index) + note.y - view.y) * view.scale) + 'px';
    if (note.width) card.style.maxWidth = Math.max(160, note.width * view.scale) + 'px';
  }
}
notesToggle.onclick = () => {
  const shown = notesLayer.classList.toggle('is-hidden') === false;
  notesToggle.setAttribute('aria-pressed', shown);
  const label = shown ? 'Hide assistant notes' : 'Show assistant notes';
  notesToggle.setAttribute('aria-label', label);
  notesToggle.title = label;
};

// ── PDF pages: rendered by pdf.js into images under the ink ──
// Visible pages are rendered sharp for the current zoom, others stay small,
// which keeps memory bounded on the iPad.
const backgrounds = new Map(); // page ID → { url, width }
let pdfDocument = null, pdfFor = null, backgroundTimer, backgroundQueue = Promise.resolve();
const LOW_WIDTH = 700, MAX_WIDTH = 2400;
async function loadPdf(canvas) {
  if (pdfFor === canvas.id) return;
  pdfDocument?.destroy();
  pdfDocument = null;
  pdfFor = canvas.id;
  for (const background of backgrounds.values()) URL.revokeObjectURL(background.url);
  backgrounds.clear();
  if (!canvas.pdf) return;
  status.textContent = 'Loading PDF · ' + canvas.title;
  const pdfjs = await import('/vendor/pdfjs/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.mjs';
  const loaded = await pdfjs.getDocument({
    url: '/api/canvases/' + canvas.id + '/pdf', httpHeaders: { Authorization: 'Bearer ' + deviceToken },
    standardFontDataUrl: '/vendor/pdfjs/standard_fonts/', cMapUrl: '/vendor/pdfjs/cmaps/', cMapPacked: true,
    wasmUrl: '/vendor/pdfjs/wasm/', iccUrl: '/vendor/pdfjs/iccs/', isEvalSupported: false
  }).promise;
  if (pdfFor !== canvas.id) return loaded.destroy();
  pdfDocument = loaded;
  showSaveState();
  scheduleBackgrounds();
  void uploadPreviewImages(canvas);
}
function scheduleBackgrounds() {
  if (!pdfDocument) return;
  clearTimeout(backgroundTimer);
  backgroundTimer = setTimeout(() => { backgroundQueue = backgroundQueue.then(updateBackgrounds).catch(() => {}); }, 150);
}
async function renderPage(page, width, type = 'image/png') {
  const pdfPage = await pdfDocument.getPage(page.pdfPage);
  const viewport = pdfPage.getViewport({ scale: width / pdfPage.getViewport({ scale: 1 }).width });
  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);
  await pdfPage.render({ canvasContext: canvas.getContext('2d'), canvas, viewport }).promise;
  const blob = await new Promise(resolve => canvas.toBlob(resolve, type, 0.75));
  canvas.width = canvas.height = 0; // frees the bitmap right away on iOS
  return blob;
}
async function updateBackgrounds() {
  if (!pdfDocument || !view) return;
  const { width, height } = size();
  const ratio = window.devicePixelRatio || 1;
  const visibleTop = view.y - height / view.scale, visibleBottom = view.y + 2 * height / view.scale;
  for (const [index, page] of pages.entries()) {
    if (page.pdfPage === undefined) continue;
    const top = pageTop(index);
    const visible = top < visibleBottom && top + page.height > visibleTop;
    // Sharp enough for the screen, in coarse steps so small zooms reuse renders.
    const wanted = visible ? Math.min(MAX_WIDTH, Math.max(LOW_WIDTH, 2 ** Math.ceil(Math.log2(page.width * view.scale * ratio / 100)) * 100)) : LOW_WIDTH;
    const current = backgrounds.get(page.id);
    if (current?.width === wanted || (!visible && current)) continue;
    const blob = await renderPage(page, wanted);
    if (!pdfDocument || !pages.includes(page)) return;
    if (current) URL.revokeObjectURL(current.url);
    const url = URL.createObjectURL(blob);
    backgrounds.set(page.id, { url, width: wanted });
    sheet.querySelector('image[data-page="' + page.id + '"]')?.setAttribute('href', url);
  }
}
// The Obsidian preview needs page images the server cannot render itself.
async function uploadPreviewImages(canvas) {
  const cached = new Set(canvas.cachedBackgrounds || []);
  for (const page of pages) {
    if (page.pdfPage === undefined || cached.has(page.id) || pdfFor !== canvas.id) continue;
    try {
      const image = await renderPage(page, 600, 'image/jpeg');
      await fetch('/api/canvases/' + canvas.id + '/backgrounds/' + page.id, { method: 'PUT', headers: { Authorization: 'Bearer ' + deviceToken, 'Content-Type': 'image/jpeg' }, body: image });
    } catch { /* the preview shows blank pages until a later visit */ }
  }
}
// Zoom around a screen point, so the spot under the fingers stays put.
function zoomAt(clientX, clientY, factor) {
  const box = sheet.getBoundingClientRect();
  const sx = clientX - box.left, sy = clientY - box.top;
  const worldX = view.x + sx / view.scale, worldY = view.y + sy / view.scale;
  view.scale *= factor;
  const clamped = Math.min(fitScale() * 8, Math.max(fitScale() * 0.5, view.scale));
  view.scale = clamped;
