<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paperlink</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f3ea;
  --paper: #fffdf5;
  --ink: #24231f;
  --muted: #777367;
  --line: #dedbd0;
  --grid: #eae7dd;
  --accent: #ff7028;
}
:root[data-theme=dark] {
  color-scheme: dark;
  --bg: #111111;
  --paper: #171716;
  --ink: #f4f3eb;
  --muted: #a09e94;
  --line: #30302c;
  --grid: #252522;
  --accent: #ff7028;
}
* { box-sizing: border-box; }
html { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
  margin: 0;
  background-color: var(--bg);
  background-image: linear-gradient(var(--line) 1px, transparent 1px),
                    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 240px 240px;
  color: var(--ink);
  font: 14px Arial, Helvetica, sans-serif;
}
header {
  flex-shrink: 0;
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 24px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
strong { display: flex; align-items: center; font-size: 20px; letter-spacing: -1px; font-weight: 600; }
strong::before {
  content: '';
  width: 10px;
  height: 10px;
  margin-right: 20px;
  background: #ff7028;
  box-shadow: 0 -10px #ffb02e, 10px 0 #ffb02e, 0 10px #f34d2c;
}
strong span { color: var(--ink); }
 .header-actions { margin-left: auto; display: flex; gap: 4px; }
header button { padding: 10px; width: 44px; height: 44px; border: 0; background: transparent; }
#storage-info { position: fixed; inset: 54px 24px auto auto; margin: 0; max-width: min(300px, calc(100vw - 32px)); padding: 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); box-shadow: 0 4px 20px #0002; }
#storage-info p { margin: 8px 0 0; line-height: 1.5; color: var(--muted); font-size: 13px; }
#status { font-size: 14px; }
nav {
  position: absolute;
  z-index: 2;
  top: 76px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  box-shadow: 0 4px 18px #00000018;
  transition: opacity 80ms ease, translate 80ms ease;
}
nav.is-hidden { opacity: 0; translate: 0 -8px; pointer-events: none; }
nav button { width: 44px; height: 44px; min-height: 44px; padding: 10px; border: 0; border-radius: 4px; }
nav .separator { width: 1px; margin: 8px 3px; background: var(--line); }
.icon { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { nav { transition: none; } }
button {
  min-height: 44px;
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 10px 18px;
  border-radius: 0;
}
nav button + button { border-left: 0; }
button[aria-pressed=true] { background: var(--accent); color: #17120b; }
button { cursor: pointer; }
button:hover { background: var(--line); }
button[aria-pressed=true]:hover { background: #ff8b40; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
main {
  position: relative;
  width: 100%;
  max-width: none;
  flex: 1;
  min-height: 0;
  margin: 0 auto;
  padding: 12px 24px 24px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
main::before, main::after {
  content: '';
  position: absolute;
  pointer-events: none;
  opacity: .65;
}
main::before {
  top: 12px;
  bottom: 24px;
  left: 12px;
  width: 6px;
  background: repeating-linear-gradient(to bottom, var(--muted) 0 1px, transparent 1px 14px);
}
main::after {
  bottom: 12px;
  left: 24px;
  right: 24px;
  height: 6px;
  background: repeating-linear-gradient(to right, var(--muted) 0 1px, transparent 1px 14px);
}
#sheet {
  display: block;
  width: 100%;
  height: 100%;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  border: 1px solid var(--line);
  touch-action: none;
}
#sheet path { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 600px) {
  header { padding: 0 16px; gap: 12px; }

  main { padding: 12px 20px 20px; }
  main::before { left: 8px; bottom: 20px; }
  main::after { bottom: 8px; left: 20px; right: 20px; }
  nav { top: 72px; }
}
#documents-panel {
  margin: auto; width: min(420px, calc(100vw - 32px)); max-height: 85dvh;
  overflow: auto; padding: 20px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px;
}
#documents-panel label, #documents-panel input, #documents-panel select { display: block; width: 100%; margin: 10px 0; }
#documents-panel input, #documents-panel select { padding: 12px; background: var(--paper); color: var(--ink); border: 1px solid var(--line); font: inherit; }
#documents-panel button { margin: 4px 0; }
#documents-panel p { color: var(--muted); font-size: 13px; line-height: 1.5; }
#documents-button[data-error=true] { color: #df5429; background: #df542918; }
#connection-status[data-error=true] { color: #df5429; }
</style>
<header>
<strong>paper<span>link</span></strong>
<button id="documents-button" aria-label="Open canvases" title="Open canvases" popovertarget="documents-panel"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 2h9v12H3Z"/></svg></button>
<div class="header-actions">
<button id="info" aria-label="Storage information" title="Storage information" popovertarget="storage-info"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.5"/></svg></button>
<button id="theme" aria-label="Color scheme: System" title="Color scheme: System"></button>
</div>
</header>
<div id="documents-panel" popover>
<h3>Canvases</h3>
<p id="connection-status" role="status">Connect using the server's device link.</p>
<label for="canvas-list">Saved in your vault</label>
<select id="canvas-list" aria-label="Saved canvases"></select>
<button id="open-canvas">Open</button>
<label for="canvas-title">New canvas title</label>
<input id="canvas-title" maxlength="200" placeholder="Untitled canvas">
<button id="new-canvas">Create blank</button>
<button id="import-draft">Import browser draft</button>
<button id="save-copy">Save current page as a new canvas</button>
<button id="retry-save">Retry pending save</button>
<p>Import creates a separate canvas and keeps your original browser draft.</p>
</div>
<div id="storage-info" popover>
<span id="status" role="status">Local draft</span>
<p>Browser drafts stay on this device. Open or create a vault canvas to save to the server. Other devices see updates when they reopen it.</p>
</div>
<nav aria-label="Drawing tools">
<button id="pen" aria-label="Pen" title="Pen" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4 5 5M4 20l4-1 12-12a2.1 2.1 0 0 0-3-3L5 16l-1 4Z"/></svg></button>
<button id="eraser" aria-label="Eraser" title="Eraser" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m13 4 7 7a2 2 0 0 1 0 3l-6 6H8l-5-5a2 2 0 0 1 0-3l7-8a2 2 0 0 1 3 0ZM7 9l9 9M8 20h13"/></svg></button>
<span class="separator" aria-hidden="true"></span>
<button id="undo" aria-label="Undo" title="Undo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 4 10l5 5M4 10h10a6 6 0 0 1 0 12" transform="translate(0 -2)"/></svg></button>
<button id="redo" aria-label="Redo" title="Redo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 5 5-5 5m5-5H10a6 6 0 0 0 0 12" transform="translate(0 -2)"/></svg></button>
</nav>
<main><svg id="sheet" viewBox="0 0 900 1100" preserveAspectRatio="xMidYMin meet" aria-label="Writing surface"></svg></main>
<script>
const sheet = document.querySelector('#sheet');
const toolbar = document.querySelector('nav');
let toolbarTimer;
function hideToolbar() {
  clearTimeout(toolbarTimer);
  toolbar.classList.add('is-hidden');
  toolbar.inert = true;
}
function revealToolbarSoon() {
  clearTimeout(toolbarTimer);
  toolbarTimer = setTimeout(() => {
    toolbar.classList.remove('is-hidden');
    toolbar.inert = false;
  }, 100);
}
const status = document.querySelector('#status');
const theme = document.querySelector('#theme');
const media = matchMedia('(prefers-color-scheme: dark)');
let strokes = [], past = [], future = [], active = null, tool = 'pen';
let beforeGesture = null, previousPoint = null, gestureTool = null;
try { strokes = JSON.parse(localStorage.getItem('paperlink-draft') || '[]'); } catch {}
if (!Array.isArray(strokes)) strokes = [];
function save() {
  if (currentDocument) { saveToVault(); return; }
  try { localStorage.setItem('paperlink-draft', JSON.stringify(strokes)); status.textContent = 'Saved in this browser'; }
  catch { status.textContent = 'Save failed – keep this browser open'; }
}
function render() {
  sheet.replaceChildren();
  for (const stroke of strokes) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', stroke);
    sheet.append(path);
  }
}
// Cancel Safari's native scrolling on the drawing surface before it claims a gesture.
for (const type of ['touchstart', 'touchmove']) {
  sheet.parentElement.addEventListener(type, event => {
    if (event.cancelable) event.preventDefault();
  }, { passive: false });
}
function point(event) {
  return new DOMPoint(event.clientX, event.clientY).matrixTransform(sheet.getScreenCTM().inverse());
}
// Test a forgiving, screen-sized swept area instead of requiring an exact path tap.
function eraseBetween(from, to) {
  const scale = Math.hypot(sheet.getScreenCTM().a, sheet.getScreenCTM().b);
  const radius = 12 / scale;
  const steps = Math.max(1, Math.ceil(Math.hypot(to.x - from.x, to.y - from.y) / radius));
  const paths = Array.from(sheet.children);
  const removed = new Set();
  paths.forEach((path, index) => {
    path.style.strokeWidth = String(radius * 2);
    for (let step = 0; step <= steps; step++) {
      const fraction = step / steps;
      const sample = new DOMPoint(from.x + (to.x - from.x) * fraction, from.y + (to.y - from.y) * fraction);
      if (path.isPointInStroke(sample)) {
        removed.add(index);
        break;
      }
    }
    path.style.removeProperty('stroke-width');
  });
  if (removed.size) {
    strokes = strokes.filter((stroke, index) => !removed.has(index));
    render();
  }
}
sheet.addEventListener('pointerdown', event => {
  if (event.cancelable) event.preventDefault();
  if (event.pointerType === 'touch' || active !== null || event.button !== 0) return;
  sheet.setPointerCapture(event.pointerId);
  active = event.pointerId;
  hideToolbar();
  gestureTool = tool;
  beforeGesture = strokes.slice();
  previousPoint = point(event);
  if (gestureTool === 'eraser') {
    eraseBetween(previousPoint, previousPoint);
  } else {
    strokes.push('M ' + previousPoint.x + ' ' + previousPoint.y + ' l 0.01 0');
    render();
  }
});
sheet.addEventListener('pointermove', event => {
  if (event.pointerId !== active) return;
  if (event.cancelable) event.preventDefault();
  const samples = event.getCoalescedEvents?.();
  for (const sample of samples?.length ? samples : [event]) {
    const p = point(sample);
    if (gestureTool === 'eraser') {
      eraseBetween(previousPoint, p);
    } else {
      strokes[strokes.length - 1] += ' L ' + p.x + ' ' + p.y;
      sheet.lastChild.setAttribute('d', strokes[strokes.length - 1]);
    }
    previousPoint = p;
  }
});
function finish(event) {
  if (event.pointerId !== active) return;
  active = null;
  revealToolbarSoon();
  if (JSON.stringify(strokes) !== JSON.stringify(beforeGesture)) {
    past.push(beforeGesture);
    future = [];
    save();
  }
  beforeGesture = null;
}
sheet.addEventListener('pointerup', finish);
sheet.addEventListener('pointercancel', finish);
sheet.addEventListener('lostpointercapture', finish);
for (const name of ['pen','eraser']) document.getElementById(name).onclick = () => {
  tool = name;
  for (const id of ['pen','eraser']) document.getElementById(id).setAttribute('aria-pressed', id === name);
};
function restoreHistory(source, destination) {
  if (active !== null || !source.length) return;
  destination.push(strokes.slice());
  strokes = source.pop();
  render();
  save();
}
document.querySelector('#undo').onclick = () => restoreHistory(past, future);
document.querySelector('#redo').onclick = () => restoreHistory(future, past);
const themeModes = ['system', 'light', 'dark'];
const themeIcons = {
  system: '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
  light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',
  dark: '<path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/>'
};
let themeMode = 'system';
try {
  const savedTheme = localStorage.getItem('paperlink-theme');
  if (themeModes.includes(savedTheme)) themeMode = savedTheme;
} catch {}
function applyTheme() {
  document.documentElement.dataset.theme = themeMode === 'system' ? (media.matches ? 'dark' : 'light') : themeMode;
  const nextMode = themeModes[(themeModes.indexOf(themeMode) + 1) % themeModes.length];
  const label = 'Color scheme: ' + themeMode + '. Switch to ' + nextMode;
  theme.setAttribute('aria-label', label);
  theme.title = label;
  theme.innerHTML = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">' + themeIcons[themeMode] + '</svg>';
}
theme.onclick = () => {
  themeMode = themeModes[(themeModes.indexOf(themeMode) + 1) % themeModes.length];
  applyTheme();
  try { localStorage.setItem('paperlink-theme', themeMode); } catch {}
};
media.addEventListener('change', applyTheme);

applyTheme(); render();

const panel = document.querySelector('#documents-panel');
const connectionStatus = document.querySelector('#connection-status');
const canvasList = document.querySelector('#canvas-list');
let currentDocument = null;
let pendingSave = null;
let saving = false;
let saveBlocked = false;
let connectionKey = '';
const keyFromLink = new URLSearchParams(location.hash.slice(1)).get('key');
try {
  connectionKey = keyFromLink || sessionStorage.getItem('paperlink-key') || '';
  if (keyFromLink) sessionStorage.setItem('paperlink-key', keyFromLink);
} catch { connectionKey = keyFromLink || ''; }
if (keyFromLink) history.replaceState(null, '', location.pathname);
function report(message, error = false) {
  connectionStatus.textContent = message;
  connectionStatus.dataset.error = String(error);
  document.querySelector('#documents-button').dataset.error = String(error);
}
function operationId() {
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
}
async function api(route, options = {}) {
  const response = await fetch('/api/canvases' + route, {
    ...options,
    headers: { Authorization: 'Bearer ' + connectionKey, 'Content-Type': 'application/json' }
  });
  const result = await response.json();
  if (!response.ok) throw Object.assign(new Error(result.error), { status: response.status });
  return result;
}
function recoveryKey() { return 'paperlink-pending-' + currentDocument.id; }
function persistRecovery() {
  localStorage.setItem(recoveryKey(), JSON.stringify({
    document: currentDocument, strokes, request: pendingSave
  }));
}
function saveToVault() {
  try {
    persistRecovery();
    status.textContent = 'Saved locally · waiting for vault';
    if (!saveBlocked) void flushSave();
  } catch {
    status.textContent = 'Local save failed – keep this page open';
    report(status.textContent, true);
  }
}
async function flushSave() {
  if (saving || !currentDocument || saveBlocked) return;
  saving = true;
  try {
    do {
      pendingSave ||= { operationId: operationId(), revision: currentDocument.revision, strokes: strokes.slice() };
      persistRecovery();
      const result = await api('/' + currentDocument.id, { method: 'PUT', body: JSON.stringify(pendingSave) });
      const sent = pendingSave.strokes;
      currentDocument.revision = result.revision;
      pendingSave = null;
      if (JSON.stringify(strokes) === JSON.stringify(sent)) {
        localStorage.removeItem(recoveryKey());
        status.textContent = 'Saved to vault · ' + currentDocument.title;
        report('Saved to vault.');
        break;
      }
      persistRecovery();
    } while (true);
  } catch (error) {
    saveBlocked = true;
    status.textContent = error.status === 409 ? 'Save conflict · open canvases to keep a copy' : 'Save pending · open canvases to retry';
    report(error.message + ' Your edits remain in this browser. Retry or save a new copy.', true);
    document.querySelector('#documents-button').title = status.textContent;
  } finally { saving = false; }
}
function canSwitch() {
  if (saving || pendingSave || (currentDocument && localStorage.getItem(recoveryKey()))) {
    throw new Error('Save, retry, or save a new copy before opening another canvas.');
  }
}
async function refreshCanvases() {
  const documents = await api('');
  canvasList.replaceChildren();
  for (const document of documents) {
    const option = new Option(document.title, document.id);
    canvasList.add(option);
  }
  if (!saveBlocked) report(documents.length ? 'Connected to your vault.' : 'Connected. Create your first canvas.');
}
function adopt(document, contents) {
  currentDocument = { id: document.id, title: document.title, revision: document.revision };
  try { sessionStorage.setItem('paperlink-open-canvas', document.id); } catch {}
  strokes = contents;
  past = []; future = []; pendingSave = null; saveBlocked = false;
  render();
  status.textContent = 'Opened · ' + document.title;
}
async function openCanvas() {
  canSwitch();
  if (!canvasList.value) throw new Error('Select a canvas first.');
  const document = await api('/' + canvasList.value);
  const recovery = localStorage.getItem('paperlink-pending-' + document.id);
  if (recovery) {
    const saved = JSON.parse(recovery);
    adopt(saved.document, saved.strokes);
    pendingSave = saved.request;
    report('Recovered local edits. Saving them to the vault.');
    await flushSave();
  } else {
    adopt(document, document.pages[0].strokes);
  }
  if (!saveBlocked) panel.hidePopover();
}
async function createDocument(mode) {
  if (saving) throw new Error('Wait for the current save to finish.');
  if (mode !== 'copy') canSwitch();
  let contents = [];
  if (mode === 'import') {
    contents = JSON.parse(localStorage.getItem('paperlink-draft') || '[]');
    if (!Array.isArray(contents) || !contents.length) throw new Error('There is no browser draft to import.');
  }
  if (mode === 'copy') contents = strokes.slice();
  const title = document.querySelector('#canvas-title').value.trim();
  if (!title) throw new Error('Enter a canvas title.');
  const created = await api('', { method: 'POST', body: JSON.stringify({ title }) });
  adopt(created, contents);
  saveToVault();
  await refreshCanvases();
  if (!saveBlocked) panel.hidePopover();
}
function action(id, callback) {
  document.getElementById(id).onclick = async () => {
    try { await callback(); }
    catch (error) { report(error.message, true); }
  };
}
panel.addEventListener('toggle', event => {
  if (event.newState === 'open') refreshCanvases().catch(error => report(error.message, true));
});
action('open-canvas', openCanvas);
action('new-canvas', () => createDocument('blank'));
action('import-draft', () => createDocument('import'));
action('save-copy', () => createDocument('copy'));
action('retry-save', async () => { saveBlocked = false; await flushSave(); });
let previouslyOpen;
try { previouslyOpen = sessionStorage.getItem('paperlink-open-canvas'); } catch {}
if (previouslyOpen) {
  sheet.style.pointerEvents = 'none';
  refreshCanvases().then(async () => {
    canvasList.value = previouslyOpen;
    await openCanvas();
  }).catch(error => {
    report(error.message + ' Reconnect or choose a canvas.', true);
    panel.showPopover();
  }).finally(() => { sheet.style.pointerEvents = ''; });
}
window.addEventListener('online', () => { if (currentDocument) { saveBlocked = false; void flushSave(); } });

</script>
</html>
