<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paperlink</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f3ea;
  --paper: #fffdf5;
  --ink: #24231f;
  --muted: #777367;
  --line: #dedbd0;
  --grid: #eae7dd;
  --accent: #ff7028;
}
:root[data-theme=dark] {
  color-scheme: dark;
  --bg: #111111;
  --paper: #171716;
  --ink: #f4f3eb;
  --muted: #a09e94;
  --line: #30302c;
  --grid: #252522;
  --accent: #ff7028;
}
* { box-sizing: border-box; }
html { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
  margin: 0;
  background-color: var(--bg);
  background-image: linear-gradient(var(--line) 1px, transparent 1px),
                    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 120px 120px;
  color: var(--ink);
  font: 14px Arial, Helvetica, sans-serif;
}
header {
  flex-shrink: 0;
  min-height: 64px;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 24px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
strong { display: flex; align-items: center; font-size: 23px; letter-spacing: -1px; font-weight: 600; }
strong::before {
  content: '';
  width: 10px;
  height: 10px;
  margin-right: 20px;
  background: #ff7028;
  box-shadow: 0 -10px #ffb02e, 10px 0 #ffb02e, 0 10px #f34d2c;
}
strong span { color: var(--ink); }
small { margin-left: auto; color: var(--muted); font-size: 12px; }
nav { display: flex; gap: 0; justify-content: center; padding: 20px 12px; flex-shrink: 0; }
button, select {
  min-height: 44px;
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 10px 18px;
  border-radius: 0;
}
nav button + button { border-left: 0; }
button[aria-pressed=true] { background: var(--accent); color: #17120b; }
button { cursor: pointer; }
button:hover { background: var(--line); }
button[aria-pressed=true]:hover { background: #ff8b40; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
main {
  width: 100%;
  max-width: 960px;
  flex: 1;
  min-height: 0;
  margin: 0 auto;
  padding: 0 24px 24px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
svg {
  display: block;
  width: 100%;
  height: 100%;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  border: 1px solid var(--line);
  touch-action: none;
}
path { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 600px) {
  header { padding: 0 16px; gap: 12px; }
  small { display: none; }
  select { margin-left: auto; }
  main { padding: 0 12px 12px; }
  nav { padding: 12px; }
}
</style>
<header><strong>paper<span>link</span></strong><small id="status">Local draft</small><select id="theme" aria-label="Color scheme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></header>
<nav aria-label="Drawing tools"><button id="pen" aria-pressed="true">Pen</button><button id="eraser" aria-pressed="false">Eraser</button><button id="undo">Undo</button><button id="redo">Redo</button></nav>
<main><svg id="sheet" viewBox="0 0 900 1100" preserveAspectRatio="xMidYMin meet" aria-label="Writing surface"></svg></main>
<script>
const sheet = document.querySelector('#sheet');
const status = document.querySelector('#status');
const theme = document.querySelector('#theme');
const media = matchMedia('(prefers-color-scheme: dark)');
let strokes = [], future = [], active = null, tool = 'pen';
try { strokes = JSON.parse(localStorage.getItem('paperlink-draft') || '[]'); } catch {}
if (!Array.isArray(strokes)) strokes = [];
function save() {
  try { localStorage.setItem('paperlink-draft', JSON.stringify(strokes)); status.textContent = 'Saved in this browser'; }
  catch { status.textContent = 'Save failed – keep this browser open'; }
}
function render() {
  sheet.replaceChildren();
  for (const stroke of strokes) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', stroke);
    sheet.append(path);
  }
}
// Cancel Safari's native scrolling on the drawing surface before it claims a gesture.
for (const type of ['touchstart', 'touchmove']) {
  sheet.parentElement.addEventListener(type, event => {
    if (event.cancelable) event.preventDefault();
  }, { passive: false });
}
function point(event) {
  return new DOMPoint(event.clientX, event.clientY).matrixTransform(sheet.getScreenCTM().inverse());
}
sheet.addEventListener('pointerdown', event => {
  if (event.cancelable) event.preventDefault();
  if (event.pointerType === 'touch' || active !== null) return;
  if (tool === 'eraser') {
    const index = Array.from(sheet.children).indexOf(event.target);
    if (index >= 0) { strokes.splice(index, 1); future = []; render(); save(); }
    return;
  }
  sheet.setPointerCapture(event.pointerId);
  const p = point(event);
  active = event.pointerId;
  strokes.push('M ' + p.x + ' ' + p.y + ' l 0.01 0');
  future = []; render();
});
sheet.addEventListener('pointermove', event => {
  if (event.pointerId !== active) return;
  if (event.cancelable) event.preventDefault();
  const samples = event.getCoalescedEvents?.();
  for (const sample of samples?.length ? samples : [event]) {
    const p = point(sample);
    strokes[strokes.length - 1] += ' L ' + p.x + ' ' + p.y;
  }
  sheet.lastChild.setAttribute('d', strokes[strokes.length - 1]);
});
function finish(event) { if (event.pointerId === active) { active = null; save(); } }
sheet.addEventListener('pointerup', finish);
sheet.addEventListener('pointercancel', finish);
sheet.addEventListener('lostpointercapture', finish);
for (const name of ['pen','eraser']) document.getElementById(name).onclick = () => {
  tool = name;
  for (const id of ['pen','eraser']) document.getElementById(id).setAttribute('aria-pressed', id === name);
};
document.querySelector('#undo').onclick = () => { if (active === null && strokes.length) { future.push(strokes.pop()); render(); save(); } };
document.querySelector('#redo').onclick = () => { if (active === null && future.length) { strokes.push(future.pop()); render(); save(); } };
function applyTheme() { document.documentElement.dataset.theme = theme.value === 'system' ? (media.matches ? 'dark' : 'light') : theme.value; }
try { theme.value = localStorage.getItem('paperlink-theme') || 'system'; } catch {}
theme.onchange = () => { applyTheme(); try { localStorage.setItem('paperlink-theme',theme.value); } catch {} };
media.addEventListener('change', applyTheme);
applyTheme(); render();
</script>
</html>
