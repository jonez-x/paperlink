<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paperlink</title>
<style>
/* Direction: calm, exact, a little warm. A desk with paper worksheets and a
   graphite pencil. The page carries the moment; the chrome stays quiet, and the
   pen icon takes the current ink colour. Spacing on a 4px grid, one easing. */
:root {
  color-scheme: light;
  --desk: #eeebe5;
  --surface: #fbfaf7;
  --raised: #efebe4;
  --paper: #fffdf9;
  --ink: #1f1b16;
  --secondary: #5e554a;
  --muted: #7b7266;
  --line: rgb(31 27 22 / 0.1);
  --grid: rgb(31 27 22 / 0.09);
  --accent: #ff7028;
  --accent-ink: #b9480f;
  --accent-soft: rgb(255 112 40 / 0.14);
  --shadow: 0 1px 2px rgb(31 27 22 / 0.06), 0 8px 24px rgb(31 27 22 / 0.08);
  --page-shadow: rgb(31 27 22 / 0.07);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
:root[data-theme=dark] {
  color-scheme: dark;
  --desk: #121110;
  --surface: #1c1a18;
  --raised: #282623;
  --paper: #1a1917;
  --ink: #efe9de;
  --secondary: #aaa398;
  --muted: #8a847a;
  --line: rgb(239 233 222 / 0.09);
  --grid: rgb(239 233 222 / 0.07);
  --accent-ink: #ff8a4c;
  --accent-soft: rgb(255 112 40 / 0.18);
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.35);
  --page-shadow: rgb(0 0 0 / 0.35);
}
* { box-sizing: border-box; }
html { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
  margin: 0;
  background: var(--desk);
  color: var(--ink);
  font: 14px/20px var(--font);
  -webkit-font-smoothing: antialiased;
}
header {
  flex-shrink: 0;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px 0 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
strong { display: flex; align-items: center; font-size: 16px; font-weight: 600; letter-spacing: 0; }
strong::before {
  content: '';
  width: 8px;
  height: 8px;
  margin: 0 20px 0 0;
  background: #ff7028;
  box-shadow: 0 -8px #ffb02e, 8px 0 #ffb02e, 0 8px #f34d2c;
}
strong span { color: var(--ink); }
#document-title { min-width: 0; overflow: hidden; color: var(--secondary); white-space: nowrap; text-overflow: ellipsis; }
#document-title:not(:empty)::before { content: '/'; margin-right: 12px; color: var(--muted); }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }
header .separator { width: 1px; height: 20px; margin: 0 6px; background: var(--line); }
header button[aria-pressed=true] { background: var(--raised); color: var(--ink); }
#pages-button { margin-left: -8px; margin-right: 8px; }
header button { width: 36px; height: 36px; min-height: 36px; padding: 8px; border: 0; background: transparent; color: var(--secondary); }
header .icon { width: 20px; height: 20px; }
#storage-info { position: fixed; inset: 56px 12px auto auto; margin: 0; width: min(320px, calc(100vw - 24px)); padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
#storage-info p { margin: 4px 0 12px; line-height: 20px; color: var(--secondary); font-size: 13px; }
#storage-info button { width: 100%; margin-top: 8px; }
#status { font-weight: 500; }
nav {
  position: absolute;
  z-index: 2;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: var(--shadow);
  transition: opacity 120ms var(--ease), translate 120ms var(--ease);
  max-width: calc(100vw - 16px);
  overflow-x: auto;
  scrollbar-width: none;
}
nav.is-hidden { opacity: 0; translate: 0 -8px; pointer-events: none; }
nav button { flex-shrink: 0; width: 40px; height: 40px; min-height: 40px; padding: 9px; border: 0; color: var(--secondary); }
nav .separator { flex-shrink: 0; width: 1px; height: 24px; margin: 0 4px; background: var(--line); }
.icon { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
button {
  min-height: 36px;
  font: inherit;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  padding: 8px 16px;
  border-radius: 10px;
  cursor: pointer;
  transition: background-color 120ms var(--ease), color 120ms var(--ease), border-color 120ms var(--ease), transform 120ms var(--ease);
  -webkit-tap-highlight-color: transparent;
}
button:hover { background: var(--raised); }
button:active { transform: scale(0.97); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* The active tool: a surface step with a hairline, not a fill. */
nav button[aria-pressed=true] { background: var(--raised); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
/* Signature: the pen and highlighter icons carry the ink they draw with. */
#pen, #marker, #shape-tool, #text-tool { position: relative; }
#pen::after, #marker::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 5px; height: 3px; border-radius: 2px; background: var(--tool-ink, var(--ink)); opacity: 0; transition: opacity 120ms var(--ease); }
#pen[aria-pressed=true]::after, #marker[aria-pressed=true]::after { opacity: 1; }
nav button:disabled { opacity: 0.35; background: transparent; cursor: default; transform: none; }
.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 500; }
.primary:hover { background: var(--secondary); }
/* Options of the active tool: tap it again. */
.panel { position: absolute; z-index: 3; display: flex; flex-wrap: nowrap; overflow-x: auto; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); scrollbar-width: none; animation: rise 160ms var(--ease); }
.panel[hidden] { display: none; }
@keyframes rise { from { opacity: 0; translate: 0 -4px; } }
#tool-options { top: 116px; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 32px); }
.panel .group { display: flex; gap: 2px; align-items: center; }
.panel .group + .group { padding-left: 4px; margin-left: 4px; border-left: 1px solid var(--line); }
.panel button { flex-shrink: 0; min-height: 36px; padding: 6px 12px; border: 0; border-radius: 10px; background: transparent; font-size: 13px; color: var(--secondary); }
.panel button:hover { background: var(--raised); }
.panel button[aria-pressed=true] { background: var(--raised); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.panel .swatch { width: 36px; padding: 0; display: grid; place-items: center; }
.panel .swatch span { width: 20px; height: 20px; border-radius: 50%; background: var(--color, var(--ink)); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.12); }
.panel .swatch[aria-pressed=true] { background: transparent; box-shadow: none; }
.panel .swatch[aria-pressed=true] span { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.panel .size span { display: block; width: 20px; height: var(--size); border-radius: 4px; background: var(--ink); }
#pick-actions { transform: translateX(-50%); }
/* Favorite pens: the ink itself, as a dot sized by its width. */
#favorites { display: flex; gap: 2px; }
#favorites:empty, nav .separator:has(+ #favorites:empty) { display: none; }
#favorites button { width: 32px; padding: 0; display: grid; place-items: center; }
#favorites span { width: var(--size); height: var(--size); border-radius: 50%; background: var(--color, var(--ink)); }
#favorites .marker span { border-radius: 2px; opacity: 0.6; height: 8px; width: 16px; }
#favorites button[aria-pressed=true] span { box-shadow: 0 0 0 2px var(--raised), 0 0 0 3px var(--muted); }
.panel .template { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 72px; padding: 8px 4px 4px; font-size: 12px; line-height: 16px; }
.panel .template .thumb { width: 36px; height: auto; border-radius: 2px; box-shadow: 0 0 0 1px var(--line); }
.panel .template .page { fill: var(--paper); }
.panel .template .grid-line { stroke: var(--muted); stroke-opacity: 0.7; stroke-width: 1; vector-effect: non-scaling-stroke; }
.template-dot { fill: var(--muted); opacity: 0.8; }
#text-editor { position: absolute; z-index: 1; margin: 0; padding: 0; border: 1px dashed var(--accent); border-radius: 2px; outline: none; background: transparent; color: var(--ink); font-family: Arial, Helvetica, sans-serif; line-height: 1.25; white-space: pre; overflow: hidden; resize: none; user-select: text; -webkit-user-select: text; }
#text-editor.on-pdf { color: #1f1b16; }
/* Pages: a sidebar beside the desk on wide screens, over it on narrow ones. */
#sidebar { position: fixed; z-index: 3; top: 48px; bottom: 0; left: 0; width: 192px; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--surface); animation: slide 220ms var(--ease); }
@keyframes slide { from { opacity: 0; translate: -12px 0; } }
#sidebar[hidden] { display: none; }
body.with-sidebar main { margin-left: 192px; }
/* The toolbar and its panels stay centred over the desk, not the whole window. */
body.with-sidebar :is(nav, #tool-options) { left: calc(50% + 96px); max-width: calc(100vw - 208px); }
#sidebar .head { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--line); font-weight: 500; }
#sidebar .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
#sidebar .head button { margin-left: auto; width: 32px; min-height: 32px; height: 32px; padding: 6px; border: 0; color: var(--secondary); }
#sidebar .list { flex: 1; overflow-y: auto; padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: thin; }
#sidebar figure { position: relative; margin: 0; text-align: center; color: var(--muted); font-size: 12px; line-height: 16px; font-variant-numeric: tabular-nums; }
#sidebar figcaption { margin-top: 8px; }
#sidebar figure > button { display: block; width: 100%; padding: 0; border: 0; border-radius: 4px; background: transparent; box-shadow: 0 0 0 1px var(--line), 0 2px 8px var(--page-shadow); overflow: hidden; }
#sidebar figure > button:active { transform: scale(0.98); }
#sidebar figure > button[aria-current=true] { box-shadow: 0 0 0 2px var(--accent), 0 2px 8px var(--page-shadow); }
#sidebar figure > button[aria-current=true] + figcaption { color: var(--accent-ink); font-weight: 500; }
#sidebar .thumb { display: block; width: 100%; height: auto; }
#sidebar .remove { position: absolute; top: 4px; right: 4px; width: 28px; min-height: 28px; height: 28px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--secondary); }
#sidebar .add { margin: 0 16px 16px; color: var(--secondary); }
@media (max-width: 820px) {
  body.with-sidebar main { margin-left: 0; }
  #sidebar { box-shadow: var(--shadow); }
}
main {
  position: relative;
  min-width: 0;
  flex: 1;
  min-height: 0;
  margin: 0;
  padding: 0;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
#sheet {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}
:is(#sheet, .thumb) .page { fill: var(--paper); stroke: var(--line); }
#sheet .page-shadow { fill: var(--page-shadow); }
:is(#sheet, .thumb) .grid-line { fill: none; stroke: var(--grid); }
:is(#sheet, .thumb) .grid-dot { fill: none; stroke: var(--grid); stroke-width: 3.6; stroke-linecap: round; }
:root[data-theme=light] .grid-dot { stroke: rgb(31 27 22 / 0.28); }
:is(#sheet, .thumb) .ink path { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
/* PDF pages keep their original look in both themes, so ink stays dark on them. */
:is(#sheet, .thumb) .pdf-page .page { fill: #ffffff; }
:is(#sheet, .thumb) .pdf-page .ink path { stroke: #1f1b16; }
/* Pressure strokes are filled outlines; text uses the theme ink unless coloured. */
:is(#sheet, .thumb) .marks path, #live path { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
:is(#sheet, .thumb) path.filled, #live path.filled { fill: var(--ink); stroke: none; }
:is(#sheet, .thumb) .pdf-page path.filled { fill: #1f1b16; stroke: none; }
:is(#sheet, .thumb) .ink text { fill: var(--ink); font-family: Arial, Helvetica, sans-serif; white-space: pre; }
:is(#sheet, .thumb) .pdf-page .ink text { fill: #1f1b16; }
:is(#sheet, .thumb, #live) .highlight { opacity: 0.35; }
/* Pictures: a quiet surface while the file loads. */
:is(#sheet, .thumb) .picture { pointer-events: none; }
:is(#sheet, .thumb) .picture-placeholder { fill: var(--raised); stroke: var(--line); }
#sheet .lasso { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 5 4; }
#sheet .pick-box { fill: none; stroke: var(--accent); stroke-dasharray: 6 4; }
#sheet .pick-handle { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
#sheet .pick-stem { stroke: var(--accent); stroke-width: 1; }
#sheet .is-editing { visibility: hidden; }
@media (max-width: 700px) {
  header { padding: 0 8px 0 16px; }
  #document-title, #page-nav button { display: none; }
}
/* Assistant notes: a separate layer over the page, readable at every zoom. */
#notes { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
#notes.is-hidden { display: none; }
.note { position: absolute; pointer-events: auto; width: max-content; max-width: 280px; padding: 8px 32px 8px 12px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-size: 13px; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
.note.stale { border-left-color: var(--muted); }
.note small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 16px; }
.note button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; min-height: 24px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; }
#notes-toggle span { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
#page-nav { display: flex; align-items: center; gap: 2px; }
#page-nav[hidden] { display: none; }
#page-number { min-width: 48px; padding: 0 4px; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--secondary); }
#sheet .selection { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 6 4; }
#ask { position: fixed; z-index: 3; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(420px, calc(100vw - 32px)); margin: 0; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); animation: rise 220ms var(--ease); }
#ask textarea { width: 100%; min-height: 72px; margin: 8px 0 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font: inherit; resize: vertical; }
#ask textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
#ask .actions { display: flex; gap: 8px; justify-content: flex-end; }
#ask label { color: var(--secondary); font-size: 13px; }
#ask-send { background: var(--accent); color: #1f1208; border-color: var(--accent); font-weight: 500; }
#ask-send:hover { background: #ff8a4c; }
#info[data-error=true] { color: #dc2626; background: rgb(220 38 38 / 0.1); }
#connection-status[data-error=true] { color: #dc2626; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

      ops.push(...diffOps(document.pages, saved.pages || [{ ...document.pages[0], strokes: saved.strokes }]));
      report('Recovered local edits. Saving them now.');
    } catch {}
    localStorage.removeItem('paperlink-pending-' + id);
  }
  if (ops.length) { applyOps(pages, ops); render(); saveToVault(ops); }
  else if (queue.length) void flushQueue();
  else showSaveState();
  void listen(id);
}
function action(id, callback) {
  document.getElementById(id).onclick = async () => {
    try { await callback(); }
    catch (error) { report(error.message, true); }
  };
}
action('retry-save', async () => { clearTimeout(retryTimer); await flushQueue(); });
// Downloads the canvas as a PDF (on the iPad: save to Files or share it).
action('export-pdf', async () => {
  if (!currentDocument) return;
  const button = document.querySelector('#export-pdf');
  button.disabled = true;
  button.textContent = 'Exporting…';
  try {
    if (queue.length) await flushQueue();
    const response = await fetch('/api/canvases/' + currentDocument.id + '/export.pdf', { headers: { Authorization: 'Bearer ' + deviceToken } });
    if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || 'Export failed.');
    const url = URL.createObjectURL(await response.blob());
    const link = Object.assign(document.createElement('a'), { href: url, download: currentDocument.title.replace(/[\\/:*?"<>|]/g, ' ') + '.pdf' });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } finally {
    button.disabled = false;
    button.textContent = 'Export PDF';
  }
});
let previouslyOpen = canvasFromLink;
try { previouslyOpen ||= sessionStorage.getItem('paperlink-open-canvas'); } catch {}
let loading = Boolean(previouslyOpen);
if (previouslyOpen) {
  sheet.style.pointerEvents = 'none';
  paired.then(() => openCanvas(previouslyOpen)).catch(error => {
    report(error.message, true);
    document.querySelector('#storage-info').showPopover();
  }).finally(() => { loading = false; sheet.style.pointerEvents = ''; });
}
// A connected draft can be imported by the local CLI without a file-management UI.
let browserDraftId;
try {
  browserDraftId = sessionStorage.getItem('paperlink-browser-draft') || operationId();
  sessionStorage.setItem('paperlink-browser-draft', browserDraftId);
} catch { browserDraftId = operationId(); }
let polling = false;
async function publishDraft() {
  if (!deviceToken || loading || polling || active !== null || currentDocument) return;
  polling = true;
  try {
    const result = await api('/drafts/' + browserDraftId, { method: 'PUT', body: JSON.stringify({ strokes: pages[0].strokes.slice() }) });
    if (result.document && active === null) {
      await openCanvas(result.document.id, { extraStrokes: pages[0].strokes.slice() });
      browserDraftId = operationId();
      try { sessionStorage.setItem('paperlink-browser-draft', browserDraftId); } catch {}
    }
  } catch { /* The local draft remains available while disconnected. */ }
  finally { polling = false; }
}
setInterval(publishDraft, 2000);
void publishDraft();
window.addEventListener('online', () => { if (currentDocument) { clearTimeout(retryTimer); void flushQueue(); wakeStream?.(); } });

</script>
