<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paperlink</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f3ea;
  --paper: #fffdf5;
  --ink: #24231f;
  --muted: #777367;
  --line: #dedbd0;
  --grid: #eae7dd;
  --accent: #ff7028;
}
:root[data-theme=dark] {
  color-scheme: dark;
  --bg: #111111;
  --paper: #171716;
  --ink: #f4f3eb;
  --muted: #a09e94;
  --line: #30302c;
  --grid: #252522;
  --accent: #ff7028;
}
* { box-sizing: border-box; }
html { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
  margin: 0;
  background-color: var(--bg);
  background-image: linear-gradient(var(--line) 1px, transparent 1px),
                    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 240px 240px;
  color: var(--ink);
  font: 14px Arial, Helvetica, sans-serif;
}
header {
  flex-shrink: 0;
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 24px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
strong { display: flex; align-items: center; font-size: 20px; letter-spacing: -1px; font-weight: 600; }
strong::before {
  content: '';
  width: 10px;
  height: 10px;
  margin-right: 20px;
  background: #ff7028;
  box-shadow: 0 -10px #ffb02e, 10px 0 #ffb02e, 0 10px #f34d2c;
}
strong span { color: var(--ink); }
small { margin-left: auto; color: var(--muted); font-size: 12px; }
nav {
  position: absolute;
  z-index: 2;
  top: 76px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  box-shadow: 0 4px 18px #00000018;
  transition: opacity 140ms ease, translate 140ms ease;
}
nav.is-hidden { opacity: 0; translate: 0 -8px; pointer-events: none; }
nav button { width: 44px; height: 44px; min-height: 44px; padding: 10px; border: 0; border-radius: 4px; }
nav .separator { width: 1px; margin: 8px 3px; background: var(--line); }
.icon { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { nav { transition: none; } }
button, select {
  min-height: 44px;
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 10px 18px;
  border-radius: 0;
}
nav button + button { border-left: 0; }
button[aria-pressed=true] { background: var(--accent); color: #17120b; }
button { cursor: pointer; }
button:hover { background: var(--line); }
button[aria-pressed=true]:hover { background: #ff8b40; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
main {
  position: relative;
  width: 100%;
  max-width: none;
  flex: 1;
  min-height: 0;
  margin: 0 auto;
  padding: 12px 24px 24px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
main::before, main::after {
  content: '';
  position: absolute;
  pointer-events: none;
  opacity: .65;
}
main::before {
  top: 12px;
  bottom: 24px;
  left: 12px;
  width: 6px;
  background: repeating-linear-gradient(to bottom, var(--muted) 0 1px, transparent 1px 14px);
}
main::after {
  bottom: 12px;
  left: 24px;
  right: 24px;
  height: 6px;
  background: repeating-linear-gradient(to right, var(--muted) 0 1px, transparent 1px 14px);
}
#sheet {
  display: block;
  width: 100%;
  height: 100%;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  border: 1px solid var(--line);
  touch-action: none;
}
#sheet path { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 600px) {
  header { padding: 0 16px; gap: 12px; }
  small { display: none; }
  select { margin-left: auto; }
  main { padding: 12px 20px 20px; }
  main::before { left: 8px; bottom: 20px; }
  main::after { bottom: 8px; left: 20px; right: 20px; }
  nav { top: 72px; }
}
</style>
<header><strong>paper<span>link</span></strong><small id="status">Local draft</small><select id="theme" aria-label="Color scheme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></header>
<nav aria-label="Drawing tools">
<button id="pen" aria-label="Pen" title="Pen" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4 5 5M4 20l4-1 12-12a2.1 2.1 0 0 0-3-3L5 16l-1 4Z"/></svg></button>
<button id="eraser" aria-label="Eraser" title="Eraser" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m13 4 7 7a2 2 0 0 1 0 3l-6 6H8l-5-5a2 2 0 0 1 0-3l7-8a2 2 0 0 1 3 0ZM7 9l9 9M8 20h13"/></svg></button>
<span class="separator" aria-hidden="true"></span>
<button id="undo" aria-label="Undo" title="Undo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 4 10l5 5M4 10h10a6 6 0 0 1 0 12" transform="translate(0 -2)"/></svg></button>
<button id="redo" aria-label="Redo" title="Redo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 5 5-5 5m5-5H10a6 6 0 0 0 0 12" transform="translate(0 -2)"/></svg></button>
</nav>
<main><svg id="sheet" viewBox="0 0 900 1100" preserveAspectRatio="xMidYMin meet" aria-label="Writing surface"></svg></main>
<script>
const sheet = document.querySelector('#sheet');
const toolbar = document.querySelector('nav');
let toolbarTimer;
function hideToolbar() {
  clearTimeout(toolbarTimer);
  toolbar.classList.add('is-hidden');
  toolbar.inert = true;
}
function revealToolbarSoon() {
  clearTimeout(toolbarTimer);
  toolbarTimer = setTimeout(() => {
    toolbar.classList.remove('is-hidden');
    toolbar.inert = false;
  }, 650);
}
const status = document.querySelector('#status');
const theme = document.querySelector('#theme');
const media = matchMedia('(prefers-color-scheme: dark)');
let strokes = [], past = [], future = [], active = null, tool = 'pen';
let beforeGesture = null, previousPoint = null, gestureTool = null;
try { strokes = JSON.parse(localStorage.getItem('paperlink-draft') || '[]'); } catch {}
if (!Array.isArray(strokes)) strokes = [];
function save() {
  try { localStorage.setItem('paperlink-draft', JSON.stringify(strokes)); status.textContent = 'Saved in this browser'; }
  catch { status.textContent = 'Save failed – keep this browser open'; }
}
function render() {
  sheet.replaceChildren();
  for (const stroke of strokes) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', stroke);
    sheet.append(path);
  }
}
// Cancel Safari's native scrolling on the drawing surface before it claims a gesture.
for (const type of ['touchstart', 'touchmove']) {
  sheet.parentElement.addEventListener(type, event => {
    if (event.cancelable) event.preventDefault();
  }, { passive: false });
}
function point(event) {
  return new DOMPoint(event.clientX, event.clientY).matrixTransform(sheet.getScreenCTM().inverse());
}
// Test a forgiving, screen-sized swept area instead of requiring an exact path tap.
function eraseBetween(from, to) {
  const scale = Math.hypot(sheet.getScreenCTM().a, sheet.getScreenCTM().b);
  const radius = 12 / scale;
  const steps = Math.max(1, Math.ceil(Math.hypot(to.x - from.x, to.y - from.y) / radius));
  const paths = Array.from(sheet.children);
  const removed = new Set();
  paths.forEach((path, index) => {
    path.style.strokeWidth = String(radius * 2);
    for (let step = 0; step <= steps; step++) {
      const fraction = step / steps;
      const sample = new DOMPoint(from.x + (to.x - from.x) * fraction, from.y + (to.y - from.y) * fraction);
      if (path.isPointInStroke(sample)) {
        removed.add(index);
        break;
      }
    }
    path.style.removeProperty('stroke-width');
  });
  if (removed.size) {
    strokes = strokes.filter((stroke, index) => !removed.has(index));
    render();
  }
}
sheet.addEventListener('pointerdown', event => {
  if (event.cancelable) event.preventDefault();
  if (event.pointerType === 'touch' || active !== null || event.button !== 0) return;
  sheet.setPointerCapture(event.pointerId);
  active = event.pointerId;
  hideToolbar();
  gestureTool = tool;
  beforeGesture = strokes.slice();
  previousPoint = point(event);
  if (gestureTool === 'eraser') {
    eraseBetween(previousPoint, previousPoint);
  } else {
    strokes.push('M ' + previousPoint.x + ' ' + previousPoint.y + ' l 0.01 0');
    render();
  }
});
sheet.addEventListener('pointermove', event => {
  if (event.pointerId !== active) return;
  if (event.cancelable) event.preventDefault();
  const samples = event.getCoalescedEvents?.();
  for (const sample of samples?.length ? samples : [event]) {
    const p = point(sample);
    if (gestureTool === 'eraser') {
      eraseBetween(previousPoint, p);
    } else {
      strokes[strokes.length - 1] += ' L ' + p.x + ' ' + p.y;
      sheet.lastChild.setAttribute('d', strokes[strokes.length - 1]);
    }
    previousPoint = p;
  }
});
function finish(event) {
  if (event.pointerId !== active) return;
  active = null;
  revealToolbarSoon();
  if (JSON.stringify(strokes) !== JSON.stringify(beforeGesture)) {
    past.push(beforeGesture);
    future = [];
    save();
  }
  beforeGesture = null;
}
sheet.addEventListener('pointerup', finish);
sheet.addEventListener('pointercancel', finish);
sheet.addEventListener('lostpointercapture', finish);
for (const name of ['pen','eraser']) document.getElementById(name).onclick = () => {
  tool = name;
  for (const id of ['pen','eraser']) document.getElementById(id).setAttribute('aria-pressed', id === name);
};
function restoreHistory(source, destination) {
  if (active !== null || !source.length) return;
  destination.push(strokes.slice());
  strokes = source.pop();
  render();
  save();
}
document.querySelector('#undo').onclick = () => restoreHistory(past, future);
document.querySelector('#redo').onclick = () => restoreHistory(future, past);
function applyTheme() { document.documentElement.dataset.theme = theme.value === 'system' ? (media.matches ? 'dark' : 'light') : theme.value; }
try { theme.value = localStorage.getItem('paperlink-theme') || 'system'; } catch {}
theme.onchange = () => { applyTheme(); try { localStorage.setItem('paperlink-theme',theme.value); } catch {} };
media.addEventListener('change', applyTheme);
applyTheme(); render();
</script>
</html>
